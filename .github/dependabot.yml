version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # pnpm refuses versions younger than its minimum release age; without a matching cooldown
    # Dependabot proposes them and its update job fails (ERR_PNPM_NO_MATURE_MATCHING_VERSION).
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # One pull request per ecosystem and week instead of one per action or image: every pull request runs
  # the full CI and the Docker build.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
