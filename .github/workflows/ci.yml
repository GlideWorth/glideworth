# Quality gates on every pull request: lint (oxlint), format check (oxfmt), typecheck, tests, build, and
# secret scanning. Change detection skips the heavy jobs when a change touches documentation only; the
# "CI gate" job is the single, stable required check.
#
# CI does not run on pushes to main. The repository ruleset on main requires "CI gate" with "require branches
# to be up to date before merging", so the pull request's merge commit CI tested is exactly what lands on main.
# The internal repository's Deploy workflow runs on the push to main itself. A push that bypasses the ruleset
# (repository admins can) is not tested by CI.
#
# Draft pull requests run nothing but the gate, which fails on purpose ("draft pull request"), so a draft never
# shows a green required check. Marking it ready for review ("ready_for_review") starts the full run.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to a pull request (or marking it ready for review) replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change detection and quick checks (one runner) ─────────────────────────
  # Every job pays for a VM and a setup, rounded up to a whole minute, so the checks that take seconds share
  # the change-detection runner: the secret scan and format (always: format also covers the Markdown, YAML and
  # JSON a docs-only change edits) and lint (code changes only). The heavy jobs read this job's "code" output
  # as soon as it is set, so a format or lint failure does not stop them: one push reports everything.
  changes:
    name: Changed paths, format, lint and secret scan
    # Drafts skip every job but the gate (see the header).
    if: github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Full history, for the diff below and the secret scan; neither needs further network access, so the
      # credentials the checkout used are not persisted. This is the pull request's merge commit, whose history
      # holds both the base and the head.
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A file counts as code unless it is documentation: docs/, any Markdown file, the licence texts or
      # the issue templates (the internal Deploy workflow skips documentation-only pushes by the same list:
      # change both together). Whenever the changed files cannot be determined (a missing commit, a git
      # error) the answer is "code", so everything runs.
      - name: Filter changed paths
        id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u

          # Prints the revision range to diff, or fails when there is none.
          range() {
            git cat-file -e "${PR_BASE}^{commit}" && git cat-file -e "${PR_HEAD}^{commit}" || return 1
            # Three dots: the changes of the pull request itself, not of the base branch since it forked.
            echo "${PR_BASE}...${PR_HEAD}"
          }

          detect() {
            local r file
            r="$(range)" || { echo "no usable diff range" >&2; return 1; }
            git diff --name-only --no-renames -z "$r" > changed.list || return 1
            while IFS= read -r -d '' file; do
              case "$file" in
                docs/*|*.md|LICENSE|packages/importers/LICENSE|.github/ISSUE_TEMPLATE/*) ;;
                *) echo "code change: $file" >&2; return 0 ;;
              esac
            done < changed.list
            return 2
          }

          # The step runs under "bash -e": a bare non-zero return would end the script before the case below.
          status=0; detect || status=$?
          case "$status" in
            0) code=true ;;
            2) code=false; echo "documentation-only change" ;;
            *) code=true; echo "::notice::could not compute the changed files; running every job" ;;
          esac
          rm -f changed.list
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Official gitleaks image, pinned by digest (v8.30.1). Scans every commit reachable from the
      # checkout, not just the tip. Findings are redacted in the log. To allow a known false positive,
      # add a .gitleaks.toml or .gitleaksignore file; do not disable the step.
      - name: Scan history with gitleaks
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --verbose /repo

      # pnpm's version comes from "packageManager" in package.json.
      - name: Set up pnpm
        if: ${{ !cancelled() }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        id: install
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      # Runs unless change detection answered "documentation only" (so also when it could not answer).
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.code != 'false' }}
        run: pnpm lint

  # ─── Typecheck and build (one runner, only when code changed) ───────────────
  # Neither is on the critical path (the tests take longer), so sharing a runner saves the second setup
  # and a rounded-up minute without slowing the run down.
  typecheck-build:
    name: Typecheck and build
    needs: changes
    # !cancelled(): the job's output is set before format and lint run, so their failure does not skip this.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ github.event.repository.private && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm's version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ─── Unit and integration tests (two runners, split by Vitest project) ──────
  # A 2-vCPU Ubicloud runner is one physical core (two hyperthreads), so Vitest runs one file at a time and
  # more workers or bigger runners do not make the suite cheaper: on 4 and 8 vCPUs the same files took
  # longer in total, and a jsdom test with a 1-second wait failed under the contention. What costs money
  # is the per-job setup and the minute each job is rounded up to, so the suite runs on two runners of
  # about equal length rather than three. The split is by project, not Vitest's hash-based --shard (which put
  # the two slowest files in different shards and left one shard at a third of another): the calculators and
  # the engine (site, core) in one, everything else in the other. The second is a negation, so a new project
  # is never left out.
  test:
    # No matrix expression in the name: a skipped job never expands it. GitHub appends the group itself.
    name: Tests
    needs: changes
    # !cancelled(): see typecheck-build.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ github.event.repository.private && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: site and core
            projects: --project site --project core
          - group: the rest
            projects: --project !site --project !core
    steps:
      # Full history so the sitemap date snapshot can be compared with git. A depth-1 checkout
      # cannot see older files; that test skips itself when the clone is shallow.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # pnpm's version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Wall-clock benchmarks are not part of this run (`pnpm bench` is opt-in).
      - name: Test
        env:
          PROJECTS: ${{ matrix.projects }}
        # One word per flag. "!" is literal here: the shell is not interactive.
        run: |
          read -ra flags <<< "$PROJECTS"
          pnpm test "${flags[@]}"

  # ─── Aggregator (the one required status check) ─────────────────────────────
  # The ruleset on main requires only "CI gate" (its name is the check name: rename both together). It
  # always runs, so the required check never waits on a job that path or draft filtering skipped. Skipped
  # jobs are fine when no code changed; when code did change, every job must have succeeded.
  gate:
    name: CI gate
    needs: [changes, typecheck-build, test]
    if: always()
    runs-on: ${{ github.event.repository.private && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      # A skipped gate would count as passing for the required check, so on a draft it fails instead.
      - name: Refuse drafts
        if: github.event.pull_request.draft == true
        run: |
          echo "::error::draft pull request: CI did not run. Mark it ready for review to run CI."
          exit 1

      - name: Check results
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          TYPECHECK_BUILD: ${{ needs.typecheck-build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          fail=0
          # The changes job also runs format, lint and the secret scan: its failure fails the gate.
          if [ "$CHANGES" != "success" ]; then echo "::error::changes job (format, lint, secret scan): $CHANGES"; fail=1; fi
          # Without a trustworthy answer from change detection the other jobs' state is meaningless
          # (they are all skipped without one), so report only that.
          if [ "$CODE_CHANGED" != "true" ] && [ "$CODE_CHANGED" != "false" ]; then
            echo "::error::change detection gave no usable answer (result: $CHANGES, code: '$CODE_CHANGED')"
            exit 1
          fi
          for pair in "typecheck-build=$TYPECHECK_BUILD" "test=$TEST"; do
            result="${pair#*=}"
            if [ "$CODE_CHANGED" = "true" ]; then
              [ "$result" = "success" ] || { echo "::error::${pair%%=*} job: $result"; fail=1; }
            else
              [ "$result" = "skipped" ] || { echo "::error::${pair%%=*} job: $result (expected skipped)"; fail=1; }
            fi
          done
          if [ "$CODE_CHANGED" != "true" ]; then echo "No code changes: lint, typecheck, build and tests skipped."; fi
          exit "$fail"
