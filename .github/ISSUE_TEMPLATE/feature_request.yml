name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds you tried
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Planning engine,
          Tax rules,
          Importers,
          API,
          MCP,
          Web app,
          Self-hosting,
          Documentation,
          Other,
        ]
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this (see CONTRIBUTING.md).
