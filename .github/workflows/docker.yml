# Docker image.
#   - Version tags (v*) and manual runs: build and smoke-test the image, then build for amd64 and arm64 and push
#     to GHCR with provenance.
#   - Pull requests and ordinary branch pushes do not trigger this workflow (it used to build and smoke-test
#     every pull request; that was a tenth of the Actions minutes). The internal repository's Deploy workflow
#     builds and smoke-tests the image before production, so a Dockerfile break shows up there, after the merge,
#     and never ships. A manual run here publishes to GHCR, so do not use it as a pull request check.
name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase; the organisation is GlideWorth.
  IMAGE_NAME: glideworth/glideworth
  SMOKE_PORT: "18787" # deliberately not the default 8787

jobs:
  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: glideworth:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /health
        run: |
          docker run -d --name smoke -p "${SMOKE_PORT}:8787" glideworth:smoke
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${SMOKE_PORT}/health"; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::/health did not respond within 60 seconds"
            docker logs smoke
            exit 1
          fi
          echo
          docker inspect --format 'container status: {{.State.Status}}' smoke

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f smoke || true

  publish:
    name: Publish to GHCR
    needs: build-and-smoke
    # Only a version tag or a manual run publishes (the only events that start this workflow).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
