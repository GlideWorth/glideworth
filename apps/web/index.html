<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Life and retirement planning: projections, chance of success, taxes and more. Hosted or on your own server."
    />
    <link rel="icon" type="image/svg+xml" href="/glideworth.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f3f1eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Glideworth" />
    <title>Glideworth</title>
    <script>
      // Apply the stored theme before first paint (no flash).
      try {
        const stored = localStorage.getItem("glideworth-ui") || localStorage.getItem("cairn-ui"); // cairn-ui: before the rename
        const ui = JSON.parse(stored || "{}")?.state ?? {};
        const t = ui.theme ?? "system";
        const dark =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        const d = document.documentElement.dataset;
        d.theme = dark ? "dark" : "light";
        d.density = ui.density ?? "comfortable";
        if (ui.reduceMotion) d.motion = "reduced";
        if (ui.reduceTransparency) d.transparency = "reduced";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
