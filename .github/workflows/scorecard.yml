# OpenSSF Scorecard: rates the repository's security practices (pinned actions, branch protection, code review,
# dependency updates, ...). Results appear under Security > Code scanning and on the public badge in the README
# (https://scorecard.dev/viewer/?uri=github.com/GlideWorth/glideworth).
#
# Public repository only: Scorecard publishes its results, and code scanning is free only for public
# repositories.
name: Scorecard

on:
  push:
    branches: [main]
  # Branch protection changes change the score.
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1" # Mondays, 05:41 UTC

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'GlideWorth/glideworth'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # sign the results published to scorecard.dev (needed for the badge)
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
